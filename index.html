<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>五界研究所｜生物調查任務 bio-five-kingdoms-game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
    <!-- 頂端統一導覽列 -->
    <div class="top-nav-bar" style="display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;">
        <a href="https://zeroseven-hue.github.io/bio-standalone-games/" style="background: #059669; color: white; border-radius: 20px; padding: 9px 20px; font-weight: 700; text-decoration: none; font-size: 14.5px; box-shadow: 0 4px 12px rgba(5,150,105,0.25); display: flex; align-items: center; gap: 6px; transition: all 0.2s;">👉 切換至【獨立單元遊戲大廳】</a>
        <button onclick="openTimerModal()" style="background: #0284c7; color: white; border: none; border-radius: 20px; padding: 9px 20px; font-weight: 700; cursor: pointer; font-size: 14.5px; box-shadow: 0 4px 12px rgba(2,132,199,0.25); display: flex; align-items: center; gap: 6px; transition: all 0.2s;">⏱️ 課堂專注計時器</button>
    </div>

    <header>
        <div class="brand">
            <span class="brand-icon">🔬</span>
            <div>
                <small>BIO DISCOVERY LAB · 五界特徵調查</small>
                <h1>五界研究所</h1>
            </div>
        </div>
        <div class="wallet">
            <small>研究金幣</small>
            <strong id="coins">0</strong>
        </div>
    </header>

    <div class="toolbar">
        <button id="sound" aria-pressed="true">音效：開</button>
        <button id="guide">玩法</button>
        <button id="atlas">圖鑑</button>
        <button id="shop">裝飾</button>
    </div>

    <section class="theme-panel">
        <h2>今天想探索哪一份大餐？</h2>
        <div class="theme-grid">
            <button data-theme="micro"><strong>微觀奇兵</strong><small>原核・原生・真菌</small></button>
            <button data-theme="plants"><strong>植感大餐</strong><small>植物分類與特徵</small></button>
            <button data-theme="animals"><strong>動物派對</strong><small>動物分類與特徵</small></button>
            <button data-theme="mixed"><strong>混合大餐</strong><small>三個單元平均抽題</small></button>
        </div>
        <p id="theme-info">選擇主題，再開始研究。</p>
        <button id="begin">開始這份研究</button>
    </section>

    <section class="dashboard">
        <div><small>本局得分</small><strong id="score">0</strong></div>
        <div><small>連續正確</small><strong id="combo">×0</strong></div>
        <div><small>研究進度</small><strong id="progress">0 / 9</strong></div>
        <label>模式
            <select id="mode">
                <option value="learn">練習｜可查看線索</option>
                <option value="challenge">挑戰｜先自己判斷</option>
            </select>
        </label>
    </section>

    <div class="section-title"><h2>01 · 研究委託</h2><span>選好樣本，再點委託提交</span></div>
    <section id="orders" class="orders" aria-label="研究委託"></section>

    <section class="bench">
        <div class="section-title"><h2>02 · 樣本暫存盤</h2><span id="capacity">0 / 7</span></div>
        <div id="belt" class="belt"></div>
        <div id="inspector" class="inspector">點下方最前面的樣本取樣，再點暫存盤選取。</div>
        <div class="bench-actions">
            <button id="clue">查看線索</button>
            <button id="return">放回樣本</button>
        </div>
    </section>

    <div class="section-title"><h2>03 · 待調查樣本</h2><span>每條軌道最下方可取樣</span></div>
    <section id="lanes" class="lanes" aria-label="樣本軌道"></section>

    <div class="controls">
        <button id="shuffle">重整樣本（2）</button>
        <button id="new">重新開始</button>
    </div>

    <p id="status" role="status" aria-live="polite">正在準備研究室…</p>

    <footer>依課堂五界分類 · 圖像為生物特徵示意 · 國中生物獨立單元遊戲大廳相容版</footer>
</main>

<div id="effects" aria-hidden="true"></div>

<dialog id="dialog">
    <div id="dialog-content"></div>
    <button id="close">回到研究室</button>
</dialog>

<!-- 課堂計時器 Modal -->
<div class="modal" id="timer-modal" style="position: fixed; inset: 0; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 9999; padding: 20px;">
    <div class="modal-card" style="background: white; border-radius: 24px; padding: 28px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2);">
        <h3 style="margin-top:0; color:#0f172a; font-size: 20px; font-weight: 800;">⏱️ 課堂專注計時器</h3>
        <div class="timer-display" id="timer-text" style="font-size: 54px; font-weight: 900; font-family: monospace; color: #0f172a; margin: 15px 0; letter-spacing: 2px;">03:00</div>
        
        <div class="timer-presets" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px;">
            <button class="preset-btn" style="background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 10px; padding: 8px 4px; font-weight: 700; font-size: 13px; cursor: pointer;" onclick="setTimerSeconds(60)">1 分鐘</button>
            <button class="preset-btn" style="background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 10px; padding: 8px 4px; font-weight: 700; font-size: 13px; cursor: pointer;" onclick="setTimerSeconds(180)">3 分鐘</button>
            <button class="preset-btn" style="background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 10px; padding: 8px 4px; font-weight: 700; font-size: 13px; cursor: pointer;" onclick="setTimerSeconds(300)">5 分鐘</button>
            <button class="preset-btn" style="background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 10px; padding: 8px 4px; font-weight: 700; font-size: 13px; cursor: pointer;" onclick="setTimerSeconds(600)">10 分鐘</button>
        </div>

        <div class="timer-controls" style="display: flex; gap: 10px;">
            <button class="t-btn t-btn-start" id="t-toggle-btn" style="flex: 1; padding: 11px; border: none; border-radius: 10px; font-weight: 800; font-size: 15px; cursor: pointer; background: #059669; color: white;" onclick="toggleTimer()">🚀 開始</button>
            <button class="t-btn t-btn-reset" style="flex: 1; padding: 11px; border: none; border-radius: 10px; font-weight: 800; font-size: 15px; cursor: pointer; background: #94a3b8; color: white;" onclick="resetTimer()">🔄 重置</button>
            <button class="t-btn" style="flex: 1; padding: 11px; border: none; border-radius: 10px; font-weight: 800; font-size: 15px; cursor: pointer; background:#e2e8f0; color:#475569;" onclick="closeTimerModal()">關閉</button>
        </div>
    </div>
</div>

<script src="game.js"></script>
</body>
</html>
